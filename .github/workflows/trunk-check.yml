# =============================================================================
# Trunk Check — Unified linting/formatting in GitHub Actions
# =============================================================================
# Handles: ruff, mypy, clippy, golangci-lint, prettier, eslint, shellcheck, etc.
# Free for open source; cached for fast runs
# =============================================================================

name: Trunk Check

on:
  pull_request:
  push:
    branches: [main, develop]
  schedule:
    # yamllint disable-line rule:comments
    - cron: "0 3 * * 1" # Weekly Monday 3am UTC

concurrency:
  group: trunk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trunk-check:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        # yamllint disable-line rule:comments
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Trunk Check
        # yamllint disable-line rule:comments
        uses: trunk-io/trunk-action@04ba50e7658c81db7356da96657e6e77f220bfa3 # v1
        with:
          # Rotate the cache after the prior cache contained incomplete tool
          # downloads; retain the reports as an artifact instead of requiring
          # Checks API write access from the PR token.
          cache-key: nanovms-trunk-v2
          setup-deps: true
          post-init: |
            "${TRUNK_PATH}" tools install --ci
          save-annotations: true

      - name: Trunk Upgrade (on schedule only)
        if: github.event_name == 'schedule'
        # yamllint disable-line rule:comments
        uses: trunk-io/trunk-action@04ba50e7658c81db7356da96657e6e77f220bfa3 # v1
        with:
          trunk-args: --upgrade
