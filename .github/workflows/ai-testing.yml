name: Testing Infrastructure
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


on:
  push:
    branches: [main]
    paths:
      - 'tests/**'
      - 'vitest.config.ts'
      - 'playwright.config.ts'
  pull_request:
    paths:
      - 'tests/**'
      - 'vitest.config.ts'
      - 'playwright.config.ts'
  schedule:
    - cron: '0 2 * * 0'  # Weekly test run (Sunday)

permissions:
  contents: read

jobs:
  bdd-tests:
    name: BDD Tier Isolation Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Run BDD Tests
        run: bunx @cucumber/cucumber run tests/bdd/tier-isolation.feature

  vitest-tests:
    name: Vitest Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install & Run Vitest
        run: |
          bun add -d vitest @vitest/coverage-v8
          bun run vitest run --reporter=json

      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vitest-coverage
          path: coverage/

  playwright-tests:
    name: Playwright Integration Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install & Run Playwright
        run: |
          bun add -d @playwright/test
          bunx playwright install --with-deps
          bun run playwright test

  go-tests:
    name: Go Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Run Go tests
        run: go test -v -race -short ./...
