---
name: SLO Alert Dispatcher
on:
  workflow_run:
    workflows: ["SLO Burn Rate Monitor"]
    types: [completed]

permissions:
  contents: read
  issues: write

env:
  REPO: ${{ github.repository }}

jobs:
  alert-dispatch:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure' }}
    steps:
      - name: Download burn rate artifact
        id: download
        uses: actions/download-artifact@v4
        with:
          name: slo-burn-rate-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Read burn rate report
        id: report
        if: steps.download.outcome == 'success'
        run: |
          if [ -f slo-report.json ]; then
            BURN_RATE=$(jq -r '.burn_rate' slo-report.json)
            SEVERITY=$(jq -r '.severity' slo-report.json)
            SUCCESS_RATE=$(jq -r '.success_rate' slo-report.json)
            FAILURE_RATE=$(jq -r '.failure_rate' slo-report.json)
            TOTAL_RUNS=$(jq -r '.total_runs' slo-report.json)
            FAILED_RUNS=$(jq -r '.failed_runs' slo-report.json)
            BUDGET_CONSUMED_PCT=$(jq -r '.budget_consumed_pct' slo-report.json)
            BUDGET_REMAINING_PCT=$(jq -r '.budget_remaining_pct' slo-report.json)
            BUDGET_CONSUMED_MIN=$(jq -r '.budget_consumed_min' slo-report.json)
            BUDGET_REMAINING_MIN=$(jq -r '.budget_remaining_min' slo-report.json)
            PROJECTED_EXHAUSTION=$(jq -r '.projected_exhaustion' slo-report.json)
            SLO_TARGET=$(jq -r '.slo_target' slo-report.json)
            REPO_NAME=$(jq -r '.repository' slo-report.json)
            TIMESTAMP=$(jq -r '.timestamp' slo-report.json)

            echo "burn_rate=${BURN_RATE}" >> "$GITHUB_OUTPUT"
            echo "severity=${SEVERITY}" >> "$GITHUB_OUTPUT"
            echo "success_rate=${SUCCESS_RATE}" >> "$GITHUB_OUTPUT"
            echo "failure_rate=${FAILURE_RATE}" >> "$GITHUB_OUTPUT"
            echo "total_runs=${TOTAL_RUNS}" >> "$GITHUB_OUTPUT"
            echo "failed_runs=${FAILED_RUNS}" >> "$GITHUB_OUTPUT"
            echo "budget_consumed_pct=${BUDGET_CONSUMED_PCT}" >> "$GITHUB_OUTPUT"
            echo "budget_remaining_pct=${BUDGET_REMAINING_PCT}" >> "$GITHUB_OUTPUT"
            echo "budget_consumed_min=${BUDGET_CONSUMED_MIN}" >> "$GITHUB_OUTPUT"
            echo "budget_remaining_min=${BUDGET_REMAINING_MIN}" >> "$GITHUB_OUTPUT"
            echo "projected_exhaustion=${PROJECTED_EXHAUSTION}" >> "$GITHUB_OUTPUT"
            echo "slo_target=${SLO_TARGET}" >> "$GITHUB_OUTPUT"
            echo "repo_name=${REPO_NAME}" >> "$GITHUB_OUTPUT"
            echo "timestamp=${TIMESTAMP}" >> "$GITHUB_OUTPUT"

            echo "### SLO Alert Report" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| **Severity** | ${SEVERITY} |" >> $GITHUB_STEP_SUMMARY
            echo "| **Burn Rate** | ${BURN_RATE}x |" >> $GITHUB_STEP_SUMMARY
            echo "| **Success Rate** | ${SUCCESS_RATE}% |" >> $GITHUB_STEP_SUMMARY
            echo "| **Budget Consumed** | ${BUDGET_CONSUMED_MIN} min (${BUDGET_CONSUMED_PCT}%) |" >> $GITHUB_STEP_SUMMARY
            echo "| **Budget Remaining** | ${BUDGET_REMAINING_MIN} min (${BUDGET_REMAINING_PCT}%) |" >> $GITHUB_STEP_SUMMARY
            echo "| **Projected Exhaustion** | ${PROJECTED_EXHAUSTION} |" >> $GITHUB_STEP_SUMMARY
          else
            echo "::warning::slo-report.json not found in artifact"
            echo "report_found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Slack alert
        if: steps.report.outputs.report_found != 'false' && steps.report.outputs.severity != 'OK' && steps.report.outputs.severity != 'INFO'
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "${{ steps.report.outputs.severity == 'PAGE' && ':rotating_light:' || ':warning:' }} SLO Burn Rate Alert - ${{ steps.report.outputs.severity }}",
                    "emoji": true
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Repository:*\n${{ env.REPO }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Severity:*\n${{ steps.report.outputs.severity }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Burn Rate:*\n${{ steps.report.outputs.burn_rate }}x"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*SLO Target:*\n${{ steps.report.outputs.slo_target }}%"
                    }
                  ]
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Success Rate:*\n${{ steps.report.outputs.success_rate }}%"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Budget Consumed:*\n${{ steps.report.outputs.budget_consumed_min }} min (${{ steps.report.outputs.budget_consumed_pct }}%)"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Budget Remaining:*\n${{ steps.report.outputs.budget_remaining_min }} min (${{ steps.report.outputs.budget_remaining_pct }}%)"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Projected Exhaustion:*\n${{ steps.report.outputs.projected_exhaustion }}"
                    }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "${{ steps.report.outputs.severity == 'PAGE' && ':red_circle: *IMMEDIATE ACTION REQUIRED* - Error budget will be exhausted within 2 days. Investigate CI failures now.' || ':large_orange_circle: *Investigation Needed* - Budget consumption is unsustainable. Review within 4 hours.' }}"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Workflow Run"
                      },
                      "url": "https://github.com/${{ env.REPO }}/actions/runs/${{ github.event.workflow_run.id }}"
                    }
                  ]
                }
              ]
            }
        continue-on-error: true

      - name: Trigger PagerDuty alert
        if: steps.report.outputs.report_found != 'false' && steps.report.outputs.severity == 'PAGE'
        env:
          PAGERDUTY_TOKEN: ${{ secrets.PAGERDUTY_TOKEN }}
        run: |
          if [ -z "$PAGERDUTY_TOKEN" ]; then
            echo "::warning::PAGERDUTY_TOKEN secret not configured, skipping PagerDuty alert"
            exit 0
          fi

          curl -s -X POST \
            "https://events.pagerduty.com/v2/enqueue" \
            -H "Content-Type: application/json" \
            -d '{
              "routing_key": "'"${PAGERDUTY_TOKEN}"'",
              "event_action": "trigger",
              "payload": {
                "summary": "SLO PAGE Alert: Burn rate '"${{ steps.report.outputs.burn_rate }}"'x in '"${{ env.REPO }}"' - Budget exhaustion in '"${{ steps.report.outputs.projected_exhaustion }}"'",
                "source": "github-actions",
                "severity": "critical",
                "component": "slo-monitor",
                "group": "'"${{ env.REPO }}"'",
                "class": "slo-burn-rate",
                "custom_details": {
                  "repository": "'"${{ env.REPO }}"'",
                  "burn_rate": "'"${{ steps.report.outputs.burn_rate }}"'x",
                  "success_rate": "'"${{ steps.report.outputs.success_rate }}"'%",
                  "budget_consumed": "'"${{ steps.report.outputs.budget_consumed_min }}"' min",
                  "budget_remaining": "'"${{ steps.report.outputs.budget_remaining_min }}"' min",
                  "projected_exhaustion": "'"${{ steps.report.outputs.projected_exhaustion }}"'",
                  "workflow_url": "https://github.com/${{ env.REPO }}/actions/runs/${{ github.event.workflow_run.id }}"
                }
              },
              "links": [
                {
                  "href": "https://github.com/${{ env.REPO }}/actions/runs/${{ github.event.workflow_run.id }}",
                  "text": "GitHub Actions Run"
                },
                {
                  "href": "https://github.com/${{ env.REPO }}/issues?q=label%3Aslo-burn-rate+state%3Aopen",
                  "text": "Open SLO Issues"
                }
              ]
            }'

          echo "PagerDuty alert triggered for PAGE severity"

      - name: Post email notification via GitHub issue
        if: steps.report.outputs.report_found != 'false' && steps.report.outputs.severity != 'OK'
        uses: actions/github-script@v7
        with:
          script: |
            const severity = '${{ steps.report.outputs.severity }}';
            const burnRate = '${{ steps.report.outputs.burn_rate }}';
            const successRate = '${{ steps.report.outputs.success_rate }}';
            const budgetConsumedPct = '${{ steps.report.outputs.budget_consumed_pct }}';
            const budgetRemainingPct = '${{ steps.report.outputs.budget_remaining_pct }}';
            const budgetConsumedMin = '${{ steps.report.outputs.budget_consumed_min }}';
            const budgetRemainingMin = '${{ steps.report.outputs.budget_remaining_min }}';
            const projectedExhaustion = '${{ steps.report.outputs.projected_exhaustion }}';
            const sloTarget = '${{ steps.report.outputs.slo_target }}';
            const totalRuns = '${{ steps.report.outputs.total_runs }}';
            const failedRuns = '${{ steps.report.outputs.failed_runs }}';
            const failureRate = '${{ steps.report.outputs.failure_rate }}';
            const repoName = '${{ env.REPO }}';
            const runId = '${{ github.event.workflow_run.id }}';
            const timestamp = '${{ steps.report.outputs.timestamp }}';

            const emoji = severity === 'PAGE' ? '\u{1F6A8}' : severity === 'WARN' ? '\u{26A0}\u{FE0F}' : '\u{2139}\u{FE0F}';

            const issueTitle = `${emoji} [${severity}] SLO Alert Dispatch - ${burnRate}x burn rate (${repoName})`;

            const body = `## ${emoji} SLO Burn Rate Alert Dispatch

            **Repository:** \`${repoName}\`
            **Severity:** \`${severity}\`
            **Timestamp:** \`${timestamp}\`
            **Workflow Run:** [#${runId}](https://github.com/${repoName}/actions/runs/${runId})

            ---

            ### Metrics

            | Metric | Value |
            |--------|-------|
            | **SLO Target** | ${sloTarget}% CI success rate |
            | **Current Success Rate** | ${successRate}% |
            | **Burn Rate** | ${burnRate}x |
            | **Error Budget Consumed** | ${budgetConsumedMin} min (${budgetConsumedPct}%) |
            | **Remaining Budget** | ${budgetRemainingMin} min (${budgetRemainingPct}%) |
            | **Projected Exhaustion** | ${projectedExhaustion} |

            ### CI Run Summary

            | Metric | Value |
            |--------|-------|
            | **Total Runs (7d)** | ${totalRuns} |
            | **Failed Runs** | ${failedRuns} |
            | **Failure Rate** | ${failureRate}% |

            ---

            ### Alerting Channels

            - **Slack:** ${severity !== 'OK' && severity !== 'INFO' ? 'Sent to configured webhook' : 'Not sent (severity below threshold)'}
            - **PagerDuty:** ${severity === 'PAGE' ? 'Triggered (incident created)' : 'Not triggered (severity below PAGE)'}
            - **Email (this issue):** Posted for notification and audit trail

            ### Escalation

            ${severity === 'PAGE' ? `> **IMMEDIATE ACTION REQUIRED**
            > The error budget will be exhausted within 2 days at the current burn rate.
            >
            > **Escalation steps:**
            > 1. Investigate the root cause of CI failures immediately
            > 2. Bisect to find the offending commit
            > 3. Block all merges until resolved
            > 4. Consider rolling back recent changes
            > 5. Notify on-call engineering lead` : severity === 'WARN' ? `> **Investigation Required Within 4 Hours**
            > Budget consumption is unsustainable at the current rate.
            >
            > **Escalation steps:**
            > 1. Review recent CI failures for patterns
            > 2. Check for flaky tests
            > 3. Create a remediation plan
            > 4. Consider pausing feature merges` : `> **Monitoring**
            > Burn rate is elevated but within acceptable bounds.
            >
            > **Recommended actions:**
            > 1. Monitor trend over next 24 hours
            > 2. Review any newly introduced test flakiness
            > 3. No immediate action required`}

            ---

            *This alert was automatically dispatched by the SLO Alert Dispatcher workflow.*`;

            // Check for existing open SLO alert dispatch issues
            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'slo-alert-dispatch',
              state: 'open',
              per_page: 10
            });

            if (existingIssues.data.length > 0) {
              // Comment on the most recent one
              const issueNumber = existingIssues.data[0].number;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: `### Updated Alert Dispatch (${timestamp})\n\n` +
                  `| Metric | Value |\n|--------|-------|\n` +
                  `| Severity | ${severity} |\n` +
                  `| Burn Rate | ${burnRate}x |\n` +
                  `| Success Rate | ${successRate}% |\n` +
                  `| Budget Remaining | ${budgetRemainingMin} min (${budgetRemainingPct}%) |\n` +
                  `| Projected Exhaustion | ${projectedExhaustion} |\n\n` +
                  `*Auto-updated by SLO Alert Dispatcher*`
              });
              core.info(`Updated existing issue #${issueNumber}`);
            } else {
              // Create new issue
              const newIssue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: issueTitle,
                body: body,
                labels: ['slo-alert-dispatch', `severity-${severity.toLowerCase()}`, 'slo-burn-rate'],
                assignees: ['kooshapari']
              });
              core.info(`Created new issue #${newIssue.data.number}`);
            }

      - name: Alert summary
        if: always() && steps.report.outputs.report_found != 'false'
        run: |
          SEVERITY="${{ steps.report.outputs.severity }}"
          echo "## Alert Dispatch Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$SEVERITY" = "OK" ] || [ "$SEVERITY" = "INFO" ]; then
            echo "| Channel | Status |" >> $GITHUB_STEP_SUMMARY
            echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
            echo "| Slack | Skipped (severity: ${SEVERITY}) |" >> $GITHUB_STEP_SUMMARY
            echo "| PagerDuty | Skipped (severity: ${SEVERITY}) |" >> $GITHUB_STEP_SUMMARY
            echo "| Email (GitHub Issue) | Posted |" >> $GITHUB_STEP_SUMMARY
          elif [ "$SEVERITY" = "WARN" ]; then
            echo "| Channel | Status |" >> $GITHUB_STEP_SUMMARY
            echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
            echo "| Slack | Sent |" >> $GITHUB_STEP_SUMMARY
            echo "| PagerDuty | Skipped (severity: WARN, not PAGE) |" >> $GITHUB_STEP_SUMMARY
            echo "| Email (GitHub Issue) | Posted |" >> $GITHUB_STEP_SUMMARY
          elif [ "$SEVERITY" = "PAGE" ]; then
            echo "| Channel | Status |" >> $GITHUB_STEP_SUMMARY
            echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
            echo "| Slack | Sent |" >> $GITHUB_STEP_SUMMARY
            echo "| PagerDuty | Triggered |" >> $GITHUB_STEP_SUMMARY
            echo "| Email (GitHub Issue) | Posted |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*Alert dispatch completed at $(date -u +%Y-%m-%dT%H:%M:%SZ)*" >> $GITHUB_STEP_SUMMARY
