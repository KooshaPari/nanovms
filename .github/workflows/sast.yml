name: Security (SAST)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule: [{cron: "0 2 * * *"}]
permissions:
  contents: read

jobs:
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: github/codeql-action/init@ed410739ba306e4ebe5e123421a6bd694e494a2b
        with:
          languages: [go, typescript, python]
      - uses: github/codeql-action/autobuild@ed410739ba306e4ebe5e123421a6bd694e494a2b  # was: no ref (default branch)
      - uses: github/codeql-action/analyze@ed410739ba306e4ebe5e123421a6bd694e494a2b  # was: no ref (default branch)