name: Security (SAST)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule: [{cron: "0 2 * * *"}]
permissions:
  contents: read

jobs:
  codeql:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: github/codeql-action/init-action@v4  # INVALID SUBPATH — actual ref is `init` at the codeql-action repo
        with:
          languages: [go, typescript, python]
      - uses: github/codeql-action/autobuild@e46ed2cbd01164d986452f91f178727624ae40d7  # was: @v4 (no ref)
      - uses: github/codeql-action/analyze@e46ed2cbd01164d986452f91f178727624ae40d7  # was: @v4 (no ref)