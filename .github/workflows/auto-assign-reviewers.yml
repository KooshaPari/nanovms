name: Auto Assign Reviewers
on:
  pull_request:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  auto-assign:
    runs-on: ubuntu-latest
    steps:
      - name: Assign reviewers based on CODEOWNERS
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });

            // Fetch CODEOWNERS file
            let codeownersContent;
            try {
              const { data: content } = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: '.github/CODEOWNERS',
              });
              codeownersContent = Buffer.from(content.content, 'base64').toString('utf-8');
            } catch (e) {
              console.log('No CODEOWNERS file found, skipping auto-assign.');
              return;
            }

            // Get changed files
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });

            const changedFiles = files.map(f => f.filename);

            // Parse CODEOWNERS
            const owners = new Set();
            const lines = codeownersContent.split('\n').filter(l => l.trim() && !l.trim().startsWith('#'));
            for (const line of lines) {
              const parts = line.trim().split(/\s+/);
              if (parts.length < 2) continue;
              const pattern = parts[0];
              const fileOwners = parts.slice(1).map(o => o.replace(/^@/, ''));

              // Check if any changed file matches the pattern
              const isDir = pattern.endsWith('/');
              for (const file of changedFiles) {
                if (isDir) {
                  if (file.startsWith(pattern) || file.includes('/' + pattern)) {
                    fileOwners.forEach(o => owners.add(o));
                  }
                } else {
                  if (file === pattern || file.endsWith('/' + pattern) || file.includes(pattern)) {
                    fileOwners.forEach(o => owners.add(o));
                  }
                }
              }
            }

            if (owners.size === 0) {
              console.log('No matching CODEOWNERS found for changed files.');
              return;
            }

            // Filter out the PR author to avoid self-assignment
            const prAuthor = pullRequest.user.login;
            const reviewers = [...owners].filter(o => o !== prAuthor);

            if (reviewers.length === 0) {
              console.log('All matching owners are the PR author, skipping.');
              return;
            }

            await github.rest.pulls.requestReviewers({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              reviewers: reviewers,
            });

            console.log(`Assigned reviewers: ${reviewers.join(', ')}`);
