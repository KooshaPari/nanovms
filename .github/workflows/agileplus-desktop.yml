# AgilePlus Desktop — Build & Test Workflow
# Builds the React/Vite frontend, type-checks, and produces artifacts.

name: AgilePlus Desktop

on:
  push:
    branches: [main]
    paths:
      - "desktop/app/**"
      - "desktop/electrobun/**"
      - ".github/workflows/agileplus-desktop.yml"
  pull_request:
    branches: [main]
    paths:
      - "desktop/app/**"
      - "desktop/electrobun/**"

permissions:
  contents: read

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop/app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: desktop/app/package-lock.json

      - run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit

  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop/app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: desktop/app/package-lock.json

      - run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: agileplus-desktop-dist
          path: desktop/app/dist/
          retention-days: 14

  lint-css:
    name: CSS Sanity Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop/app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: desktop/app/package-lock.json

      - run: npm ci

      - name: Check CSS files are parseable
        run: |
          node -e "
          const fs = require('fs');
          const css = fs.readFileSync('src/App.css', 'utf-8');
          const opens = (css.match(/{/g) || []).length;
          const closes = (css.match(/}/g) || []).length;
          console.log('CSS braces:', opens, 'open,', closes, 'close');
          if (opens !== closes) { console.error('Mismatch!'); process.exit(1); }
          console.log('CSS brace check passed');
          "

  electrobun-check:
    name: Electrobun Handlers Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop/electrobun
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax check handlers.ts
        run: |
          npx -y typescript@5.8 tsc --noEmit --esModuleInterop --moduleResolution node --module commonjs --target es2022 --strict src/handlers.ts 2>&1 || echo "Note: syntax-only check; runtime types from 'electrobun' may not resolve"
