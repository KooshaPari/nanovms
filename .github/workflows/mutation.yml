name: Mutation
on:
  push:
    branches: [main]
  pull_request:
jobs:
  mutants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-mutants
      - run: cargo mutants --no-shuffle -j 2 --timeout 120 2>&1 | tail -100 || true
