name: OpenTelemetry Stack

on:
  workflow_dispatch:
  push:
    paths:
      - "otel/**"
  pull_request:
    paths:
      - "otel/**"

jobs:
  validate-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate collector config
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/otel/collector-config.yaml:/etc/otelcol/config.yaml:ro \
            otel/opentelemetry-collector-contrib:latest \
            --config=/etc/otelcol/config.yaml --dry-run

  docker-compose-up:
    runs-on: ubuntu-latest
    needs: validate-config
    steps:
      - uses: actions/checkout@v7

      - name: Start OTel stack
        working-directory: otel
        run: |
          docker compose up -d
          sleep 15

      - name: Verify collector health
        run: |
          curl -sf http://localhost:13133/ || exit 1
          echo "Collector is healthy"

      - name: Verify Jaeger UI
        run: |
          curl -sf http://localhost:16686/ || exit 1
          echo "Jaeger UI is accessible"

      - name: Verify Prometheus
        run: |
          curl -sf http://localhost:9090/-/healthy || exit 1
          echo "Prometheus is healthy"

      - name: Verify Loki
        run: |
          curl -sf http://localhost:3100/ready || exit 1
          echo "Loki is ready"

      - name: Verify Grafana
        run: |
          curl -sf http://localhost:3000/api/health || exit 1
          echo "Grafana is healthy"

      - name: Send test trace
        run: |
          curl -s -X POST http://localhost:4318/v1/traces \
            -H "Content-Type: application/json" \
            -d '{
              "resourceSpans": [{
                "resource": {
                  "attributes": [
                    {"key": "service.name", "value": {"stringValue": "nanovms-test"}},
                    {"key": "sandbox.type", "value": {"stringValue": "microvm"}}
                  ]
                },
                "scopeSpans": [{
                  "scope": {"name": "test"},
                  "spans": [{
                    "traceId": "0102030405060708090a0b0c0d0e0f10",
                    "spanId": "0102030405060708",
                    "name": "sandbox-test-span",
                    "kind": 1,
                    "startTimeUnixNano": "1700000000000000000",
                    "endTimeUnixNano": "1700000001000000000",
                    "status": {"code": 1}
                  }]
                }]
              }]
            }'

      - name: Send test log to Loki
        run: |
          curl -s -X POST http://localhost:4318/v1/logs \
            -H "Content-Type: application/json" \
            -d '{
              "resourceLogs": [{
                "resource": {
                  "attributes": [
                    {"key": "service.name", "value": {"stringValue": "nanovms-test"}},
                    {"key": "sandbox.type", "value": {"stringValue": "microvm"}}
                  ]
                },
                "scopeLogs": [{
                  "scope": {"name": "test"},
                  "logRecords": [{
                    "timeUnixNano": "1700000000000000000",
                    "severityNumber": 9,
                    "severityText": "INFO",
                    "body": {"stringValue": "sandbox startup complete"},
                    "attributes": [
                      {"key": "sandbox.name", "value": {"stringValue": "test-vm-001"}}
                    ]
                  }]
                }]
              }]
            }'

      - name: Verify trace in Jaeger
        run: |
          sleep 5
          curl -sf "http://localhost:16686/api/traces?service=nanovms-test" | grep -q "sandbox-test-span"
          echo "Trace found in Jaeger"

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose -f otel/docker-compose.yml logs
