# Chaos Gate Workflow
# Runs on every PR and blocks merge if chaos tests fail.
# Use 'needs: [chaos-gate]' in merge queue configuration.

name: Chaos Gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: chaos-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chaos-gate:
    name: Chaos Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Run critical chaos tests (gate)
        run: |
          go test -v -timeout 120s ./pkg/chaos/... \
            -run "CircuitBreaker|RetryBackoff|TimeoutHandling" \
            -count=1 2>&1 | tee chaos-gate.log

      - name: Upload gate results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-gate-results
          path: chaos-gate.log
          retention-days: 30

      - name: Fail gate if chaos tests failed
        if: failure()
        run: |
          echo "::error::Chaos gate tests failed - merge blocked"
          exit 1
