# /Users/kooshapari/CodeProjects/Phenotype/repos/nanovms/.github/workflows/ci.yml
name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-24.04
    permissions: { pull-requests: read }
    outputs:
      go: ${{ steps.filter.outputs.go }}
      any: ${{ steps.filter.outputs.any }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: { fetch-depth: 50 }
      - uses: dorny/paths-filter@cae9006b65a1a53044b518c68e13e835c54948a7
        id: filter
        with:
          filters: |
            go: ['**/*.go', 'go.mod', 'go.sum', '.github/workflows/ci.yml']
            any: ['**']

  test:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # go.mod requires Go 1.25; older toolchains reject the module before tests run.
        go: ['1.25']
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - run: go vet ./...
      - run: go test -race -shuffle=on ./...
      - name: Build all binaries
        run: |
          go build -o /tmp/nanovms ./cmd/nanovms
          go build -o /tmp/nvms ./cmd/nvms
          go build -o /tmp/nvms-cgo ./cmd/nvms-cgo

  lint:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.25'
          cache: true
      - uses: golangci/golangci-lint-action@aaa42aa0628b4ae2578232a66b541047968fac86
        with:
          version: v1.59

  security:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with: { go-version: '1.25' }
      - run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
          gosec ./...
      - run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
