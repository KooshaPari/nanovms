name: Security Guard
on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: '0 0 * * *'
permissions:
  contents: read



concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  trivy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run Trivy
        uses: aquasecurity/trivy-action@2736533278103862a861f4a35ebac3e97854d956  # was: @master
        with:
          scan-type: 'fs'
          severity: 'CRITICAL,HIGH'
