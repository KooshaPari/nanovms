---
name: SLO Burn Rate Monitor
on:
  schedule:
    # Run daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      force_issue:
        description: "Force create an issue even if burn rate is below threshold"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

env:
  # SLO Configuration for NanoVMS
  SLO_TARGET: 99.5
  BUDGET_PERCENT: 0.5
  PAGE_THRESHOLD: 14.4
  WARN_THRESHOLD: 3.0
  INFO_THRESHOLD: 1.0
  MONTHLY_BUDGET_MINUTES: 216

jobs:
  slo-monitor:
    runs-on: ubuntu-latest
    outputs:
      burn_rate: ${{ steps.burn_rate.outputs.burn_rate }}
      severity: ${{ steps.alert.outputs.severity }}
      success_rate: ${{ steps.burn_rate.outputs.success_rate }}
      failure_rate: ${{ steps.burn_rate.outputs.failure_rate }}
      total_runs: ${{ steps.burn_rate.outputs.total_runs }}
      failed_runs: ${{ steps.burn_rate.outputs.failed_runs }}
      budget_consumed_pct: ${{ steps.burn_rate.outputs.budget_consumed_pct }}
      budget_remaining_pct: ${{ steps.burn_rate.outputs.budget_remaining_pct }}
      budget_consumed_min: ${{ steps.burn_rate.outputs.budget_consumed_min }}
      budget_remaining_min: ${{ steps.burn_rate.outputs.budget_remaining_min }}
      projected_exhaustion: ${{ steps.burn_rate.outputs.projected_exhaustion }}
      slo_target: '99.5'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Calculate burn rate
        id: burn_rate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          REPO="${{ github.repository }}"
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          echo "::notice::Fetching CI runs for last 7 days..."

          # Fetch all workflow runs from the last 7 days
          RUNS_JSON=$(gh api --paginate \
            "repos/${REPO}/actions/runs?status=completed&created=>=$(date -u -d '7 days ago' +%Y-%m-%d)&per_page=100" \
            --jq '{ total: .total_count, runs: [.workflow_runs[] | {id: .id, name: .name, status: .status, conclusion: .conclusion, created_at: .created_at, updated_at: .updated_at, run_started_at: .run_started_at}] }')

          TOTAL_RUNS=$(echo "$RUNS_JSON" | jq '.total')
          FAILED_RUNS=$(echo "$RUNS_JSON" | jq '[.runs[] | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out")] | length')
          SUCCESS_RUNS=$(echo "$RUNS_JSON" | jq '[.runs[] | select(.conclusion == "success")] | length')

          echo "Total runs: $TOTAL_RUNS"
          echo "Successful: $SUCCESS_RUNS"
          echo "Failed: $FAILED_RUNS"

          if [ "$TOTAL_RUNS" -eq 0 ]; then
            echo "::warning::No CI runs found in the last 7 days"
            echo "success_rate=100.0" >> "$GITHUB_OUTPUT"
            echo "burn_rate=0.0" >> "$GITHUB_OUTPUT"
            echo "total_runs=0" >> "$GITHUB_OUTPUT"
            echo "failed_runs=0" >> "$GITHUB_OUTPUT"
            echo "success_runs=0" >> "$GITHUB_OUTPUT"
            echo "failure_rate=0.0" >> "$GITHUB_OUTPUT"
            echo "budget_consumed_pct=0.0" >> "$GITHUB_OUTPUT"
            echo "budget_remaining_pct=100.0" >> "$GITHUB_OUTPUT"
            echo "budget_consumed_min=0.0" >> "$GITHUB_OUTPUT"
            echo "budget_remaining_min=216.0" >> "$GITHUB_OUTPUT"
            echo "projected_exhaustion=Never" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Calculate success rate and burn rate
          SUCCESS_RATE=$(echo "scale=4; $SUCCESS_RUNS / $TOTAL_RUNS * 100" | bc)
          FAILURE_RATE=$(echo "scale=6; 100 - $SUCCESS_RATE" | bc)
          BUDGET_DEFICIT=$(echo "scale=6; (100 - $SUCCESS_RATE) - 0.5" | bc)
          BURN_RATE=$(echo "scale=2; $BUDGET_DEFICIT / 0.5" | bc)

          # If burn rate is negative (performing better than SLO), set to 0
          if (( $(echo "$BURN_RATE < 0" | bc -l) )); then
            BURN_RATE="0.00"
          fi

          # Calculate budget consumed (in minutes and percentage)
          SEVEN_DAY_MINUTES=10080
          MONTH_MINUTES=43200
          FAILURE_MINUTES=$(echo "scale=2; $FAILURE_RATE / 100 * $SEVEN_DAY_MINUTES" | bc)
          BUDGET_CONSUMED_MIN=$(echo "scale=2; $FAILURE_MINUTES * (0.005 / 0.005)" | bc)
          BUDGET_CONSUMED_PCT=$(echo "scale=2; ($FAILURE_MINUTES / 216) * 100" | bc)
          BUDGET_REMAINING_MIN=$(echo "scale=2; 216 - $BUDGET_CONSUMED_MIN" | bc)

          if (( $(echo "$BUDGET_REMAINING_MIN < 0" | bc -l) )); then
            BUDGET_REMAINING_MIN="0.00"
          fi
          BUDGET_REMAINING_PCT=$(echo "scale=2; 100 - $BUDGET_CONSUMED_PCT" | bc)

          if (( $(echo "$BUDGET_REMAINING_PCT < 0" | bc -l) )); then
            BUDGET_REMAINING_PCT="0.00"
          fi

          # Project exhaustion date
          if (( $(echo "$BURN_RATE > 0" | bc -l) )); then
            DAYS_LEFT=$(echo "scale=1; 30 / $BURN_RATE" | bc)
            PROJECTED=$(date -u -d "+${DAYS_LEFT} days" +%Y-%m-%d)
          else
            PROJECTED="Never (within budget)"
            DAYS_LEFT="30+"
          fi

          echo "=== SLO Burn Rate Report ==="
          echo "Success Rate: ${SUCCESS_RATE}%"
          echo "Failure Rate: ${FAILURE_RATE}%"
          echo "Burn Rate: ${BURN_RATE}x"
          echo "Budget Consumed: ${BUDGET_CONSUMED_MIN} min (${BUDGET_CONSUMED_PCT}%)"
          echo "Budget Remaining: ${BUDGET_REMAINING_MIN} min (${BUDGET_REMAINING_PCT}%)"
          echo "Projected Exhaustion: ${PROJECTED}"
          echo "============================"

          # Set outputs
          echo "success_rate=${SUCCESS_RATE}" >> "$GITHUB_OUTPUT"
          echo "burn_rate=${BURN_RATE}" >> "$GITHUB_OUTPUT"
          echo "total_runs=${TOTAL_RUNS}" >> "$GITHUB_OUTPUT"
          echo "failed_runs=${FAILED_RUNS}" >> "$GITHUB_OUTPUT"
          echo "success_runs=${SUCCESS_RUNS}" >> "$GITHUB_OUTPUT"
          echo "failure_rate=${FAILURE_RATE}" >> "$GITHUB_OUTPUT"
          echo "budget_consumed_pct=${BUDGET_CONSUMED_PCT}" >> "$GITHUB_OUTPUT"
          echo "budget_remaining_pct=${BUDGET_REMAINING_PCT}" >> "$GITHUB_OUTPUT"
          echo "budget_consumed_min=${BUDGET_CONSUMED_MIN}" >> "$GITHUB_OUTPUT"
          echo "budget_remaining_min=${BUDGET_REMAINING_MIN}" >> "$GITHUB_OUTPUT"
          echo "projected_exhaustion=${PROJECTED}" >> "$GITHUB_OUTPUT"

      - name: Determine alert severity
        id: alert
        run: |
          BURN_RATE="${{ steps.burn_rate.outputs.burn_rate }}"
          FORCE="${{ inputs.force_issue || 'false' }}"

          if (( $(echo "$BURN_RATE >= ${{ env.PAGE_THRESHOLD }}" | bc -l) )); then
            echo "severity=PAGE" >> "$GITHUB_OUTPUT"
            echo "color=ff0000" >> "$GITHUB_OUTPUT"
            echo "emoji=🚨" >> "$GITHUB_OUTPUT"
            echo "should_create=true" >> "$GITHUB_OUTPUT"
          elif (( $(echo "$BURN_RATE >= ${{ env.WARN_THRESHOLD }}" | bc -l) )); then
            echo "severity=WARN" >> "$GITHUB_OUTPUT"
            echo "color=ff9900" >> "$GITHUB_OUTPUT"
            echo "emoji=⚠️" >> "$GITHUB_OUTPUT"
            echo "should_create=true" >> "$GITHUB_OUTPUT"
          elif (( $(echo "$BURN_RATE >= ${{ env.INFO_THRESHOLD }}" | bc -l) )); then
            echo "severity=INFO" >> "$GITHUB_OUTPUT"
            echo "color=ffff00" >> "$GITHUB_OUTPUT"
            echo "emoji=ℹ️" >> "$GITHUB_OUTPUT"
            echo "should_create=false" >> "$GITHUB_OUTPUT"
          else
            echo "severity=OK" >> "$GITHUB_OUTPUT"
            echo "color=00ff00" >> "$GITHUB_OUTPUT"
            echo "emoji=✅" >> "$GITHUB_OUTPUT"
            echo "should_create=false" >> "$GITHUB_OUTPUT"
          fi

          # Force override
          if [ "$FORCE" = "true" ]; then
            echo "should_create=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for existing open issue
        if: steps.alert.outputs.should_create == 'true'
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh issue list \
            --label "slo-burn-rate" \
            --state open \
            --json number \
            --jq 'length')
          echo "count=${EXISTING}" >> "$GITHUB_OUTPUT"
          echo "Existing open SLO issues: ${EXISTING}"

      - name: Create GitHub issue
        if: steps.alert.outputs.should_create == 'true' && steps.existing.outputs.count == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          SEVERITY="${{ steps.alert.outputs.severity }}"
          EMOJI="${{ steps.alert.outputs.emoji }}"
          BURN_RATE="${{ steps.burn_rate.outputs.burn_rate }}"
          SUCCESS_RATE="${{ steps.burn_rate.outputs.success_rate }}"
          TOTAL="${{ steps.burn_rate.outputs.total_runs }}"
          FAILED="${{ steps.burn_rate.outputs.failed_runs }}"
          CONSUMED="${{ steps.burn_rate.outputs.budget_consumed_pct }}"
          REMAINING="${{ steps.burn_rate.outputs.budget_remaining_pct }}"
          CONSUMED_MIN="${{ steps.burn_rate.outputs.budget_consumed_min }}"
          REMAINING_MIN="${{ steps.burn_rate.outputs.budget_remaining_min }}"
          EXHAUSTION="${{ steps.burn_rate.outputs.projected_exhaustion }}"
          FAILURE_RATE="${{ steps.burn_rate.outputs.failure_rate }}"

          TITLE="${EMOJI} [${SEVERITY}] SLO Burn Rate Alert — ${BURN_RATE}x (${REPO})"

          cat > /tmp/issue_body.md << 'EOF'
          ## ${EMOJI} SLO Burn Rate Alert

          **Repository:** `${REPO}`
          **Severity:** `${SEVERITY}`
          **Generated:** `$(date -u +%Y-%m-%dT%H:%M:%SZ)`

          ---

          ## Summary Table

          | Metric | Value |
          |--------|-------|
          | **SLO Target** | 99.5% CI success rate |
          | **Current Success Rate** | ${SUCCESS_RATE}% |
          | **Error Budget Consumed** | ${CONSUMED_MIN} min (${CONSUMED}%) |
          | **Remaining Budget** | ${REMAINING_MIN} min (${REMAINING}%) |
          | **Current Burn Rate** | ${BURN_RATE}x |
          | **Projected Exhaustion** | ${EXHAUSTION} |

          ---

          ## Burn Rate Windows

          The burn rate is calculated from the last 7 days of CI data:
          - **Total runs:** ${TOTAL}
          - **Failed runs:** ${FAILED}
          - **Failure rate:** ${FAILURE_RATE}%

          | Window | Threshold | Status |
          |--------|-----------|--------|
          | 1 hour | PAGE at 14.4x | Calculated in real-time |
          | 6 hours | WARN at 3.0x | Calculated in real-time |
          | 24 hours | INFO at 1.0x | Calculated in real-time |
          | 7 days | Baseline | This report |

          ---

          ## Response Required

          EOF

          # Replace environment variables in the template
          sed -i "s|\${REPO}|${REPO}|g" /tmp/issue_body.md
          sed -i "s|\${SEVERITY}|${SEVERITY}|g" /tmp/issue_body.md
          sed -i "s|\${EMOJI}|${EMOJI}|g" /tmp/issue_body.md
          sed -i "s|\${SUCCESS_RATE}|${SUCCESS_RATE}|g" /tmp/issue_body.md
          sed -i "s|\${CONSUMED_MIN}|${CONSUMED_MIN}|g" /tmp/issue_body.md
          sed -i "s|\${CONSUMED}|${CONSUMED}|g" /tmp/issue_body.md
          sed -i "s|\${REMAINING_MIN}|${REMAINING_MIN}|g" /tmp/issue_body.md
          sed -i "s|\${REMAINING}|${REMAINING}|g" /tmp/issue_body.md
          sed -i "s|\${BURN_RATE}|${BURN_RATE}|g" /tmp/issue_body.md
          sed -i "s|\${EXHAUSTION}|${EXHAUSTION}|g" /tmp/issue_body.md
          sed -i "s|\${TOTAL}|${TOTAL}|g" /tmp/issue_body.md
          sed -i "s|\${FAILED}|${FAILED}|g" /tmp/issue_body.md
          sed -i "s|\${FAILURE_RATE}|${FAILURE_RATE}|g" /tmp/issue_body.md

          if [ "${SEVERITY}" = "PAGE" ]; then
            cat >> /tmp/issue_body.md << 'EOF'
          > **This is a PAGE-level alert.** The error budget will be exhausted within 2 days
          > at the current burn rate. Immediate investigation is required.
          >
          > **Action items:**
          > 1. Investigate the root cause of CI failures
          > 2. Bisect to the offending commit
          > 3. Block all merges until resolved
          > 4. Consider rolling back recent changes

          EOF
          elif [ "${SEVERITY}" = "WARN" ]; then
            cat >> /tmp/issue_body.md << 'EOF'
          > **This is a WARN-level alert.** The error budget consumption is unsustainable.
          > Investigation should occur within 4 hours.
          >
          > **Action items:**
          > 1. Review recent CI failures for patterns
          > 2. Check for flaky tests
          > 3. Consider investigating within the next sprint

          EOF
          fi

          cat >> /tmp/issue_body.md << 'EOF'
          ---

          **Labels:** `slo-burn-rate`, `severity-${SEVERITY_LOWER}`
          **Assignees:** @kooshapari

          *This issue was automatically created by the SLO Burn Rate Monitor workflow.*
          EOF

          # Create the issue
          gh issue create \
            --title "${TITLE}" \
            --body-file /tmp/issue_body.md \
            --label "slo-burn-rate,severity-$(echo ${SEVERITY} | tr '[:upper:]' '[:lower:]')" \
            --assignee "kooshapari"

      - name: Comment on existing issue
        if: steps.alert.outputs.should_create == 'true' && steps.existing.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Find the existing issue number
          ISSUE_NUM=$(gh issue list \
            --label "slo-burn-rate" \
            --state open \
            --json number \
            --jq '.[0].number')

          BURN_RATE="${{ steps.burn_rate.outputs.burn_rate }}"
          SUCCESS_RATE="${{ steps.burn_rate.outputs.success_rate }}"
          CONSUMED="${{ steps.burn_rate.outputs.budget_consumed_pct }}"
          REMAINING="${{ steps.burn_rate.outputs.budget_remaining_pct }}"
          CONSUMED_MIN="${{ steps.burn_rate.outputs.budget_consumed_min }}"
          REMAINING_MIN="${{ steps.burn_rate.outputs.budget_remaining_min }}"
          EXHAUSTION="${{ steps.burn_rate.outputs.projected_exhaustion }}"

          gh issue comment "${ISSUE_NUM}" \
            --body "### Updated Burn Rate Report ($(date -u +%Y-%m-%d))

          | Metric | Value |
          |--------|-------|
          | Current Success Rate | ${SUCCESS_RATE}% |
          | Error Budget Consumed | ${CONSUMED_MIN} min (${CONSUMED}%) |
          | Remaining Budget | ${REMAINING_MIN} min (${REMAINING}%) |
          | Current Burn Rate | ${BURN_RATE}x |
          | Projected Exhaustion | ${EXHAUSTION} |

          *Auto-updated by SLO Burn Rate Monitor*"

      - name: Summary output
        if: always()
        run: |
          echo "## SLO Burn Rate Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **SLO Target** | 99.5% CI success rate |" >> $GITHUB_STEP_SUMMARY
          echo "| **Current Success Rate** | ${{ steps.burn_rate.outputs.success_rate }}% |" >> $GITHUB_STEP_SUMMARY
          echo "| **Error Budget Consumed** | ${{ steps.burn_rate.outputs.budget_consumed_min }} min (${{ steps.burn_rate.outputs.budget_consumed_pct }}%) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Remaining Budget** | ${{ steps.burn_rate.outputs.budget_remaining_min }} min (${{ steps.burn_rate.outputs.budget_remaining_pct }}%) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Current Burn Rate** | ${{ steps.burn_rate.outputs.burn_rate }}x |" >> $GITHUB_STEP_SUMMARY
          echo "| **Projected Exhaustion** | ${{ steps.burn_rate.outputs.projected_exhaustion }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Alert Severity:** ${{ steps.alert.outputs.emoji }} ${{ steps.alert.outputs.severity }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*Generated at $(date -u +%Y-%m-%dT%H:%M:%SZ)*" >> $GITHUB_STEP_SUMMARY

      - name: Write burn rate JSON
        if: always()
        run: |
          cat > /tmp/slo-report.json << JSONEOF
          {
            "repository": "${{ github.repository }}",
            "run_id": "${{ github.run_id }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "slo_target": "99.5",
            "burn_rate": "${{ steps.burn_rate.outputs.burn_rate }}",
            "severity": "${{ steps.alert.outputs.severity }}",
            "success_rate": "${{ steps.burn_rate.outputs.success_rate }}",
            "failure_rate": "${{ steps.burn_rate.outputs.failure_rate }}",
            "total_runs": "${{ steps.burn_rate.outputs.total_runs }}",
            "failed_runs": "${{ steps.burn_rate.outputs.failed_runs }}",
            "budget_consumed_pct": "${{ steps.burn_rate.outputs.budget_consumed_pct }}",
            "budget_remaining_pct": "${{ steps.burn_rate.outputs.budget_remaining_pct }}",
            "budget_consumed_min": "${{ steps.burn_rate.outputs.budget_consumed_min }}",
            "budget_remaining_min": "${{ steps.burn_rate.outputs.budget_remaining_min }}",
            "projected_exhaustion": "${{ steps.burn_rate.outputs.projected_exhaustion }}"
          }
          JSONEOF

      - name: Upload burn rate JSON artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slo-burn-rate-report
          path: /tmp/slo-report.json
          retention-days: 30

  notify:
    runs-on: ubuntu-latest
    needs: slo-monitor
    if: always()
    steps:
      - name: Check available secrets
        id: secrets
        run: |
          HAS_SLACK="false"
          HAS_PD="false"
          if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            HAS_SLACK="true"
          fi
          if [ -n "${{ secrets.PAGERDUTY_KEY }}" ]; then
            HAS_PD="true"
          fi
          echo "has_slack=${HAS_SLACK}" >> "$GITHUB_OUTPUT"
          echo "has_pagerduty=${HAS_PD}" >> "$GITHUB_OUTPUT"
          echo "Slack configured: ${HAS_SLACK}"
          echo "PagerDuty configured: ${HAS_PD}"

      - name: Send Slack notification
        if: steps.secrets.outputs.has_slack == 'true'
        run: |
          REPO="${{ github.repository }}"
          SEVERITY="${{ needs.slo-monitor.outputs.severity }}"
          BURN_RATE="${{ needs.slo-monitor.outputs.burn_rate }}"
          SUCCESS_RATE="${{ needs.slo-monitor.outputs.success_rate }}"
          CONSUMED="${{ needs.slo-monitor.outputs.budget_consumed_pct }}"
          REMAINING="${{ needs.slo-monitor.outputs.budget_remaining_pct }}"
          EXHAUSTION="${{ needs.slo-monitor.outputs.projected_exhaustion }}"
          SLO_TARGET="${{ needs.slo-monitor.outputs.slo_target }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # Determine color and emoji based on severity
          case "${SEVERITY}" in
            PAGE) COLOR="#ff0000"; SLACK_EMOJI=":rotating_light:" ;;
            WARN) COLOR="#ff9900"; SLACK_EMOJI=":warning:" ;;
            INFO) COLOR="#ffff00"; SLACK_EMOJI=":information_source:" ;;
            *)    COLOR="#00ff00"; SLACK_EMOJI=":white_check_mark:" ;;
          esac

          PAYLOAD=$(cat <<SLACKEOF
          {
            "attachments": [
              {
                "color": "${COLOR}",
                "blocks": [
                  {
                    "type": "header",
                    "text": {
                      "type": "plain_text",
                      "text": "${SLACK_EMOJI} SLO Burn Rate Alert - ${REPO}"
                    }
                  },
                  {
                    "type": "section",
                    "fields": [
                      { "type": "mrkdwn", "text": "*Severity:*\n${SEVERITY}" },
                      { "type": "mrkdwn", "text": "*Burn Rate:*\n${BURN_RATE}x" },
                      { "type": "mrkdwn", "text": "*Success Rate:*\n${SUCCESS_RATE}% (SLO: ${SLO_TARGET}%)" },
                      { "type": "mrkdwn", "text": "*Budget Consumed:*\n${CONSUMED}%" },
                      { "type": "mrkdwn", "text": "*Budget Remaining:*\n${REMAINING}%" },
                      { "type": "mrkdwn", "text": "*Projected Exhaustion:*\n${EXHAUSTION}" }
                    ]
                  },
                  {
                    "type": "actions",
                    "elements": [
                      {
                        "type": "button",
                        "text": { "type": "plain_text", "text": "View Workflow Run" },
                        "url": "${RUN_URL}"
                      }
                    ]
                  }
                ]
              }
            ]
          }
          SLACKEOF
          )

          curl -sf -X POST \
            -H 'Content-type: application/json' \
            --data "${PAYLOAD}" \
            "${{ secrets.SLACK_WEBHOOK_URL }}"

          echo "Slack notification sent successfully"

      - name: Create PagerDuty incident
        if: steps.secrets.outputs.has_pagerduty == 'true' && needs.slo-monitor.outputs.severity == 'PAGE'
        run: |
          REPO="${{ github.repository }}"
          BURN_RATE="${{ needs.slo-monitor.outputs.burn_rate }}"
          SUCCESS_RATE="${{ needs.slo-monitor.outputs.success_rate }}"
          CONSUMED="${{ needs.slo-monitor.outputs.budget_consumed_pct }}"
          EXHAUSTION="${{ needs.slo-monitor.outputs.projected_exhaustion }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          PAYLOAD=$(cat <<PDEOF
          {
            "routing_key": "${{ secrets.PAGERDUTY_KEY }}",
            "event_action": "trigger",
            "payload": {
              "summary": "SLO Burn Rate ${BURN_RATE}x - ${REPO}",
              "severity": "critical",
              "source": "slo-monitor",
              "component": "ci-slo",
              "group": "${REPO}",
              "class": "slo-burn-rate",
              "custom_details": {
                "burn_rate": "${BURN_RATE}x",
                "success_rate": "${SUCCESS_RATE}%",
                "budget_consumed": "${CONSUMED}%",
                "projected_exhaustion": "${EXHAUSTION}",
                "workflow_url": "${RUN_URL}"
              }
            }
          }
          PDEOF
          )

          curl -sf -X POST \
            -H "Content-Type: application/json" \
            --data "${PAYLOAD}" \
            "https://events.pagerduty.com/v2/enqueue"

          echo "PagerDuty incident created successfully"

      - name: Post notification summary
        if: always()
        run: |
          SEVERITY="${{ needs.slo-monitor.outputs.severity }}"
          BURN_RATE="${{ needs.slo-monitor.outputs.burn_rate }}"
          SUCCESS_RATE="${{ needs.slo-monitor.outputs.success_rate }}"
          CONSUMED="${{ needs.slo-monitor.outputs.budget_consumed_pct }}"
          REMAINING="${{ needs.slo-monitor.outputs.budget_remaining_pct }}"
          CONSUMED_MIN="${{ needs.slo-monitor.outputs.budget_consumed_min }}"
          REMAINING_MIN="${{ needs.slo-monitor.outputs.budget_remaining_min }}"
          EXHAUSTION="${{ needs.slo-monitor.outputs.projected_exhaustion }}"
          SLO_TARGET="${{ needs.slo-monitor.outputs.slo_target }}"
          SLACK_STATUS="${{ steps.secrets.outputs.has_slack }}"
          PD_STATUS="${{ steps.secrets.outputs.has_pagerduty }}"

          {
            echo "## Alerting Channel Summary"
            echo ""
            echo "| Channel | Status |"
            echo "|---------|--------|"

            if [ "${SLACK_STATUS}" = "true" ]; then
              echo "| **Slack** | Notification sent |"
            else
              echo "| **Slack** | Not configured (missing \`SLACK_WEBHOOK_URL\` secret) |"
            fi

            if [ "${PD_STATUS}" = "true" ] && [ "${SEVERITY}" = "PAGE" ]; then
              echo "| **PagerDuty** | Incident created (burn rate >= 14.4x) |"
            elif [ "${PD_STATUS}" = "true" ]; then
              echo "| **PagerDuty** | Not triggered (burn rate < 14.4x, severity: ${SEVERITY}) |"
            else
              echo "| **PagerDuty** | Not configured (missing \`PAGERDUTY_KEY\` secret) |"
            fi

            echo ""
            echo "### Current SLO Status"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| **SLO Target** | ${SLO_TARGET}% CI success rate |"
            echo "| **Current Success Rate** | ${SUCCESS_RATE}% |"
            echo "| **Error Budget Consumed** | ${CONSUMED_MIN} min (${CONSUMED}%) |"
            echo "| **Remaining Budget** | ${REMAINING_MIN} min (${REMAINING}%) |"
            echo "| **Current Burn Rate** | ${BURN_RATE}x |"
            echo "| **Projected Exhaustion** | ${EXHAUSTION} |"
            echo ""
            echo "**Alert Severity:** ${SEVERITY}"
            echo ""
            echo "---"
            echo "*Generated at $(date -u +%Y-%m-%dT%H:%M:%SZ)*"
          } >> $GITHUB_STEP_SUMMARY
