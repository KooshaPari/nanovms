name: Integration Tests (Docker-in-Docker)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.23', '1.24', '1.25']
    
    services:
      docker:
        image: docker:dind
        privileged: true
        options: --health-cmd "docker info" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: ${{ matrix.go-version }}

      - name: Run Integration Tests with Coverage
        id: tests
        run: |
          go test -tags=integration -count=1 -v -timeout=600s -parallel=4 -coverprofile=coverage.out ./internal/adapters/sandbox/...
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
        env:
          DOCKER_HOST: tcp://localhost:2375
          DOCKER_BUILDKIT: 1

      - name: Generate Job Summary
        if: always()
        run: |
          echo "## Integration Test Results" >> $GITHUB_STEP_SUMMARY
          echo "The Docker-in-Docker integration tests have completed." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Go Version:** \`${{ matrix.go-version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Target:** \`internal/adapters/sandbox/\`" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "**Coverage:** ${{ steps.tests.outputs.coverage }}%" >> $GITHUB_STEP_SUMMARY

      - name: Upload Coverage
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: coverage-go-${{ matrix.go-version }}
          path: coverage.out
          retention-days: 14
