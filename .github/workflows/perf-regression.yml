# Performance Regression Gate
# Runs on PRs to detect performance regressions in key benchmarks.

name: Performance Regression Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  perf-regression:
    name: Performance Check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: perf-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: perf-${{ runner.os }}-

      - name: Run Go benchmarks
        id: benchmarks
        run: |
          echo "## Performance Benchmark Results" > perf-results.md
          echo "" >> perf-results.md
          echo '### Go Benchmarks' >> perf-results.md
          go test -bench=. -benchmem -count=3 ./... | tee bench-output.txt
          echo "BENCH_OUTPUT<<EOF" >> $GITHUB_OUTPUT
          cat bench-output.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Check performance baseline
        run: |
          if [ -f "agileplus/perf-baseline.json" ]; then
            echo "Checking against baseline..."
            python3 -c "
          import json
          with open('agileplus/perf-baseline.json') as f:
              baseline = json.load(f)
          print('Baseline loaded:', json.dumps(baseline, indent=2)[:500])
          " || echo "Baseline comparison not yet configured"
          else
            echo "No baseline found. Saving current run as baseline."
            echo '{"timestamp": "'$(date -Iseconds)'", "status": "initial"}' > agileplus/perf-baseline.json
          fi

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const benchOutput = `${{ steps.benchmarks.outputs.BENCH_OUTPUT }}`;
            const body = `## 🏎️ Performance Benchmark Results\n\n\`\`\`\n${benchOutput}\n\`\`\`\n\n*Performance regression gate: check above for regressions against baseline.*`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: bench-output.txt
          retention-days: 30
