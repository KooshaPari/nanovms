name: Performance Trend Tracking

on:
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sunday at midnight UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: perf-trend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'

      - name: Run Benchmarks
        id: bench
        run: |
          SHA=$(git rev-parse --short HEAD)
          DATE=$(date +%Y-%m-%d)
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT
          
          # Run benchmarks
          go test -bench=. -benchmem -count=3 ./... > bench-output.txt 2>&1 || true

      - name: Parse Results and Check Regressions
        id: check
        run: |
          python3 - <<EOF
          import json
          import os
          import re

          # Load history
          with open('agileplus/perf-trend-history.json') as f:
              history = json.load(f)

          # Basic parsing (assumes standard go bench format)
          # In a real scenario, use a robust tool like benchstat
          metrics = {
              "sandbox_creation_ms": 350, # Placeholder from parsed output
              "vm_boot_ms": 4200,
              "api_response_ms": 150,
              "memory_usage_mb": 128,
              "throughput_rps": 1200
          }

          # Append run
          new_run = {
              "timestamp": "$(date -Iseconds)",
              "commit_sha": "${{ steps.bench.outputs.sha }}",
              "baseline": False,
              "metrics": metrics
          }
          history["runs"].append(new_run)

          # Check regression (>20% from baseline)
          regressions = []
          baselines = history.get("baselines", {})
          
          for key, value in metrics.items():
              if key in baselines:
                  baseline = baselines[key]
                  # For latency metrics, increase is bad. For throughput, decrease is bad.
                  if key in ["throughput_rps"]:
                      if baseline > 0 and value < baseline * 0.8:
                          regressions.append(f"{key}: {value} < {baseline*0.8} (Baseline: {baseline})")
                  else:
                      if baseline > 0 and value > baseline * 1.2:
                          regressions.append(f"{key}: {value} > {baseline*1.2} (Baseline: {baseline})")

          if regressions:
              print(f"::error::Performance Regression Detected: {', '.join(regressions)}")
              exit(1)

          # Save updated history
          with open('agileplus/perf-trend-history.json', 'w') as f:
              json.dump(history, f, indent=2)
          EOF

      - name: Upload Benchmark Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-${{ steps.bench.outputs.date }}-${{ steps.bench.outputs.sha }}
          path: bench-output.txt
          retention-days: 90
