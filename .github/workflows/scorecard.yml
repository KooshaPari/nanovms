# =============================================================================
# OpenSSF Scorecard — Automated security best practices check
# =============================================================================
# Runs weekly + on main to track supply chain security posture
# Free for public repos, adds security badge
# =============================================================================

name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    # Weekly Monday 4:25 UTC
    - cron: "25 4 * * 1"
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        # v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Run Scorecard
        # v2.4.0
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF
        # v3.28.18
        uses: github/codeql-action/upload-sarif@fca7ace96b7d713c7035881819e25a804e825323
        with:
          sarif_file: results.sarif

      - name: Upload artifact
        # v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5
