name: CODEOWNERS Syntax Check

on:
  pull_request:
    paths:
      - '**/CODEOWNERS'

jobs:
  validate-codeowners:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify CODEOWNERS syntax
        run: |
          FILE=""
          if [ -f "CODEOWNERS" ]; then
            FILE="CODEOWNERS"
          elif [ -f ".github/CODEOWNERS" ]; then
            FILE=".github/CODEOWNERS"
          fi

          if [ -z "$FILE" ]; then
            echo "No CODEOWNERS file found."
            exit 1
          fi

          echo "Validating $FILE..."

          while IFS= read -r line || [ -n "$line" ]; do
            # Skip comments and empty lines
            [[ "$line" =~ ^[[:space:]]*# ]] && continue
            [[ -z "${line// }" ]] && continue
            
            # Check for owner syntax: pattern owner1 owner2...
            # At least one owner must start with @ or be an email
            if ! echo "$line" | grep -qE '[^ ]+ +(@[^ ]+|[^ ]+@[^ ]+)[ ]*'; then
              echo "Syntax error: Invalid line (missing owner?): $line"
              exit 1
            fi
          done < "$FILE"

          echo "CODEOWNERS syntax is valid."
