# Test Configuration for NanoVMS
# Modern testing stack: Vitest + Playwright + Go

project:
  name: nanovms
  language: go
  framework: go-test

# Test Configuration
test:
  # Vitest for JavaScript/TypeScript tests
  vitest:
    enabled: true
    config: vitest.config.ts
    coverage:
      provider: v8
      thresholds:
        lines: 80
        functions: 80
        branches: 70

  # Playwright for E2E tests
  playwright:
    enabled: true
    config: playwright.config.ts
    browsers: [chromium, firefox, webkit]

  # Go tests
  go:
    enabled: true
    race: true
    timeout: 120s

# Test patterns
patterns:
  unit: "tests/unit/**/*_test.go"
  integration: "tests/integration/**/*_test.go"
  e2e: "tests/e2e/**/*.ts"
  bdd: "tests/bdd/**/*.feature"

# Coverage targets
coverage:
  unit: 80
  integration: 70
  e2e: 60
  overall: 75

# Test rules
rules:
  - pattern: "internal/adapters/**"
    required: [create, start, stop, delete]
  - pattern: "internal/sandbox/**"
    required: [isolation, resource_limits]
