# Trunk.io configuration (schema 0.1).
# See https://docs.trunk.io/reference/trunk-yaml.
version: 0.1

cli:
  version: 1.22.12

plugins:
  sources:
    - id: trunk
      ref: v1.6.6
      uri: https://github.com/trunk-io/plugins

runtimes:
  enabled:
    - go@1.25.0
    - node@22.0.0
    - python@3.12.13

lint:
  enabled:
    - actionlint
    - black
    - clippy
    - eslint
    - golangci-lint
    - mypy
    - prettier
    - ruff
    - rustfmt
    - shellcheck
    - taplo
    - yamllint
  definitions:
    - name: black
      direct_configs:
        - pyproject.toml
    - name: clippy
      direct_configs:
        - clippy.toml
        - .clippy.toml
    - name: eslint
      direct_configs:
        - .eslintrc.*
        - eslint.config.*
    - name: golangci-lint
      direct_configs:
        - .golangci.yml
        - .golangci.yaml
    - name: mypy
      direct_configs:
        - mypy.ini
        - pyproject.toml
    - name: ruff
      direct_configs:
        - ruff.toml
        - pyproject.toml
    - name: prettier
      direct_configs:
        - .prettierrc
        - prettier.config.*
    - name: rustfmt
      direct_configs:
        - rustfmt.toml
  ignore:
    - linters: [ALL]
      paths:
        - node_modules/**
        - .venv/**
        - venv/**
        - __pycache__/**
        - target/**
        - dist/**
        - build/**
        - .git/**
        - vendor/**
        - "*.lock"
        - go.sum

actions:
  enabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
