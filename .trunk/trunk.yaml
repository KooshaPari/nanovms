# Trunk.io configuration (schema 0.1).
# Keep repository lint and format policy in the supported list form.
version: 0.1

cli:
  version: 1.22.12

plugins:
  sources:
    - id: trunk
      ref: v1.6.6
    - id: trunk-fmt
      ref: v1.2.1

linters:
  - name: actionlint
    enabled: true
  - name: black
    enabled: true
    direct_configs:
      - pyproject.toml
  - name: clippy
    enabled: true
    direct_configs:
      - clippy.toml
      - .clippy.toml
  - name: eslint
    enabled: true
    direct_configs:
      - .eslintrc.*
      - eslint.config.*
  - name: golangci-lint
    enabled: true
    direct_configs:
      - .golangci.yml
      - .golangci.yaml
  - name: mypy
    enabled: true
    direct_configs:
      - mypy.ini
      - pyproject.toml
  - name: ruff
    enabled: true
    direct_configs:
      - ruff.toml
      - pyproject.toml
  - name: shellcheck
    enabled: true
  - name: taplo
    enabled: true
  - name: yamllint
    enabled: true

formatters:
  - name: black
    enabled: true
    direct_configs:
      - pyproject.toml
  - name: prettier
    enabled: true
    direct_configs:
      - .prettierrc
      - prettier.config.*
  - name: rustfmt
    enabled: true
    direct_configs:
      - rustfmt.toml

ignore:
  - paths:
      - node_modules/
      - .venv/
      - venv/
      - __pycache__/
      - target/
      - dist/
      - build/
      - .git/
      - vendor/
      - "*.lock"
      - go.sum
    type: include
