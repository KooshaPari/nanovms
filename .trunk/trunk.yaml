---
# Trunk.io configuration (schema 0.1).
version: 0.1

cli:
  version: 1.22.12

plugins:
  sources:
    - id: trunk
      uri: https://github.com/trunk-io/plugins
      ref: v1.6.6

lint:
  enabled:
    - actionlint
    - clippy
    - eslint
    - golangci-lint
    - mypy
    - ruff
    - rustfmt
    - shellcheck
    - taplo
    - yamllint
  ignore:
    - linters: [ALL]
      paths:
        - .git/
        - "*.lock"
