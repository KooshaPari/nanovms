# Trunk.io — repository lint configuration.
# Keep this file on the Trunk 0.1 schema so hosted checks and local Trunk use
# the same plugin and linter definitions.
version: 0.1

cli:
  version: 1.22.12

plugins:
  sources:
    - id: trunk
      ref: v1.6.6
    - id: trunk-fmt
      ref: v1.2.1

linters:
  - name: actionlint
    enabled: true
  - name: clippy
    enabled: true
  - name: eslint
    enabled: true
  - name: golangci-lint
    enabled: true
  - name: mypy
    enabled: true
  - name: ruff
    enabled: true
  - name: rustfmt
    enabled: true
  - name: shellcheck
    enabled: true
  - name: taplo
    enabled: true
  - name: yamllint
    enabled: true

ignore:
  - paths:
      - .git/
      - "**/*.lock"
    type: include
