# goreleaser config (https://goreleaser.com/)
project_name: nanovms

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/nanovms
    binary: nanovms
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goarch: arm
        goos: windows
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}}

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

release:
  github:
    owner: KooshaPari
    name: nanovms
    draft: false
    prerelease: auto
  name_template: "v{{.Version}}"
  header: |
    # nanovms v{{.Version}}
    Released: {{.Date}}

    ## Install
    ```sh
    curl -fsSL https://github.com/KooshaPari/nanovms/releases/download/v{{.Version}}/{{.ProjectName}}_{{.Version}}_{{.Os}}_{{.Arch}}.tar.gz | tar xz
    ```

snapshot:
  name_template: "{{ incpatch .Version }}-next"
