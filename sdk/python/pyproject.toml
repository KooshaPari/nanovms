[build-system]
requires = ["hatchling>=1.21.0", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "melosviz-sdk"
version = "0.1.0"
description = "Python SDK for Melosviz — client bindings for NanoVMS virtualization APIs"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "NanoVMS Contributors", email = "dev@nanovms.dev" }
]
keywords = ["nanovms", "virtualization", "wasm", "firecracker", "gvisor", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Operating System Kernels",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "typing-extensions>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5.0",
    "respx>=0.21.0",
]

[project.urls]
Homepage = "https://github.com/KooshaPari/nanovms"
Documentation = "https://github.com/KooshaPari/nanovms/tree/main/sdk/python"
Repository = "https://github.com/KooshaPari/nanovms.git"
Issues = "https://github.com/KooshaPari/nanovms/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/melosviz_sdk"]

[tool.hatch.version]
path = "src/melosviz_sdk/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --cov=melosviz_sdk --cov-report=term-missing"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
