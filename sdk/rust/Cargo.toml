[package]
name = "nvms-sdk"
version = "0.1.0"
edition = "2021"
authors = ["NanoVMS Contributors"]
description = "Rust SDK for NanoVMS — 3-tier isolation and virtualization APIs"
license = "Apache-2.0"
repository = "https://github.com/KooshaPari/nanovms"
keywords = ["nanovms", "virtualization", "wasm", "firecracker", "gvisor"]
categories = ["virtualization", "api-bindings"]
rust-version = "1.78"

[dependencies]
figment = { version = "0.10", features = ["env", "toml"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
thiserror = "1.0"
url = "2.5"
async-trait = "0.1"
libc = "0.2"

[dev-dependencies]
tempfile = "3.10"
tokio-test = "0.4"
wiremock = "0.6"

[features]
default = ["rest"]
rest = ["reqwest"]
grpc = []

[[example]]
name = "deploy_vm"
path = "examples/deploy_vm.rs"

[[example]]
name = "sandbox_tier"
path = "examples/sandbox_tier.rs"

[workspace]
